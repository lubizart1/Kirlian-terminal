name: Release

# Pushing a tag like v1.1.0 runs every check, builds the package, and creates a
# DRAFT GitHub release with the wheel, source archive, and install.sh attached
# (the installer carries this release's version and wheel checksum). Nothing is
# published until you review the draft and press "Publish release". Nothing is
# uploaded to PyPI. Once published, this is the release that
#   curl -fsSL https://github.com/lubizart1/Kirlian-terminal/releases/latest/download/install.sh | sh
# installs.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  draft:
    name: Draft release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: The tag matches the package version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - run: uv build
      - run: packaging/render-install.sh
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes --title "$GITHUB_REF_NAME"
