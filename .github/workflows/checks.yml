name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format, translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Every language catalog covers every string
        run: uv run python scripts/i18n_catalog.py

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install the playback engine (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv ffmpeg
      - name: Install the playback engine (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg
      - run: uv sync --locked
      - run: uv run pytest -q

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv build
      - run: packaging/render-install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # No checkout and no setup-uv: the installer must bring its own uv and Python.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Linux needs mpv from the package manager first
        if: runner.os == 'Linux'
        run: |
          sh dist/install.sh && exit 1 || echo "Without mpv the installer stops, as intended."
          sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv
      - name: Install as a listener would (macOS installs mpv itself with Homebrew)
        run: KIRLIAN_WHEEL=$(ls dist/*.whl) sh dist/install.sh
      - name: The installed command starts
        run: |
          bin="$(uv tool dir --bin 2>/dev/null || echo "$HOME/.local/bin")"
          "$bin/kirlian" --version
